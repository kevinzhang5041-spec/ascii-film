<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Sorter</title>
<style>
:root {
  --bg: #0c0e0c; --panel: #131613; --panel-2: #191d19; --line: #232823; --line-2: #2f362f;
  --text: #e7e9e4; --muted: #8f968d; --faint: #5f665e;
  --accent: #a8d47f; --accent-ink: #0d160a; --accent-soft: rgba(168, 212, 127, .12);
  --warn: #e7b65c; --err: #ef7a6a; --info: #86b9e6;
  --bright: #ffd23c; --texture: #6ed778; --dark: #5a96ff; --inbox: #c9cdc6; --rejected: #ef7a6a;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  --tw: 190px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); }
button, input, select { font: inherit; color: inherit; }
[hidden] { display: none !important; }
a { color: inherit; }

.top { display: flex; align-items: center; gap: 18px; padding: 12px 20px; border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 6; background: rgba(12, 14, 12, .94); backdrop-filter: blur(8px); flex-wrap: wrap; }
.brand { font: 600 15px var(--mono); white-space: nowrap; }
.brand .glyph { color: var(--accent); margin-right: 6px; }
.brand .sub { color: var(--faint); font-weight: 400; }
.back { font: 12.5px var(--mono); color: var(--muted); text-decoration: none; }
.back:hover { color: var(--text); }
.grow { flex: 1; }
.job { font: 12px var(--mono); color: var(--info); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40vw; }

.bar { display: flex; align-items: center; gap: 10px; padding: 10px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap;
  position: sticky; top: 53px; z-index: 5; background: rgba(12, 14, 12, .94); backdrop-filter: blur(8px); }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab { background: transparent; border: 1px solid var(--line-2); border-radius: 999px; padding: 4px 11px; font: 12.5px var(--mono);
  color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.tab .d { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.tab b { font-weight: 500; color: var(--text); }
.tab.on { background: var(--panel-2); color: var(--text); border-color: #4a544a; }
.btn { background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 11px; font-size: 12.5px;
  font-weight: 500; cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: #4a544a; background: #1e231e; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
.in { background: #0f120f; border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 8px; font: 12.5px var(--mono); }
.ctl { display: inline-flex; align-items: center; gap: 6px; font: 12px var(--mono); color: var(--muted); }
.ctl input[type=range] { accent-color: var(--accent); width: 110px; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 5px 10px; font: 12px var(--mono); color: var(--muted); cursor: pointer; }
.seg button.on { background: var(--panel-2); color: var(--text); }

main { padding: 14px 20px 110px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--tw), 1fr)); gap: 10px; }
.card { position: relative; border-radius: 8px; overflow: hidden; background: #000; border: 2px solid transparent; cursor: pointer;
  user-select: none; outline: none; }
.card .im { aspect-ratio: 16 / 9; background: #070807; display: block; width: 100%; object-fit: cover; }
.whole .card .im { object-fit: contain; }
.card .meta { display: flex; align-items: center; gap: 6px; padding: 5px 7px; background: var(--panel); font: 11.5px var(--mono); }
.card .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--c); }
.card .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.card .sg { color: var(--faint); white-space: nowrap; }
.card .sg i { font-style: normal; color: var(--c); }
.card.sel { border-color: var(--accent); }
.card.sel::after { content: "✓"; position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; border-radius: 50%; background: var(--accent);
  color: var(--accent-ink); font: 700 12px/20px var(--sans); text-align: center; }
.card.focus { box-shadow: 0 0 0 2px rgba(255, 255, 255, .55); }
.card .where { position: absolute; top: 6px; left: 6px; font: 10.5px/1 var(--mono); padding: 4px 6px; border-radius: 5px;
  background: rgba(0, 0, 0, .72); color: var(--c); }
.ustrip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 10px 20px 0; }
.ucard { border: 1px solid var(--line-2); border-radius: 10px; padding: 8px 11px; background: var(--panel); cursor: pointer; min-width: 0; }
.ucard:hover { border-color: #4a544a; }
.ucard .uh { display: flex; align-items: center; gap: 7px; font: 12.5px var(--mono); }
.ucard .uh .d { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
.ucard .uh b { font-weight: 500; }
.ucard .uh .x { margin-left: auto; font-weight: 600; color: var(--lvl); }
.ucard .ul { font: 11.5px var(--mono); color: var(--muted); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ucard .ul.need { color: var(--faint); }
.ubar { height: 4px; border-radius: 2px; background: #1f241f; margin-top: 6px; overflow: hidden; }
.ubar i { display: block; height: 100%; background: var(--lvl); }
.card .uses { position: absolute; left: 6px; bottom: 32px; font: 600 11px/1 var(--mono); padding: 4px 6px; border-radius: 5px;
  background: rgba(0, 0, 0, .75); color: var(--lvl); }
.card .uses.none { color: var(--faint); font-weight: 400; }
@media (max-width: 700px) { .ustrip { grid-template-columns: minmax(0, 1fr); padding: 10px 16px 0; } }
.empty { color: var(--faint); font: 13px/1.8 var(--mono); text-align: center; padding: 60px 20px; }

.act { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 10px 20px; background: rgba(19, 22, 19, .97); border-top: 1px solid var(--line-2); }
.act .n { font: 12.5px var(--mono); color: var(--muted); min-width: 110px; }
.act .btn kbd, .zbar .btn kbd { font: 10.5px var(--mono); color: var(--faint); margin-left: 6px; }
.act .btn .d, .zbar .btn .d { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-right: 6px; }
.act .hint { font: 11.5px var(--mono); color: var(--faint); margin-left: auto; }

.zoom { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .92); display: flex; flex-direction: column; }
.zimg { flex: 1; min-height: 0; display: grid; place-items: center; padding: 14px; position: relative; }
.zwrap { position: relative; max-width: 100%; max-height: 100%; }
.zwrap img { display: block; max-width: calc(100vw - 28px); max-height: calc(100vh - 150px); }
.zwrap { overflow: hidden; }
.zwrap .frame { position: absolute; box-shadow: 0 0 0 9999px rgba(0, 0, 0, .58); pointer-events: none; }
.zwrap .frame.hand { outline: 1.5px solid var(--accent); }
.cropping .zwrap .frame { pointer-events: auto; cursor: move; outline: 2px solid var(--accent); touch-action: none; }
.frame .hd { position: absolute; width: 16px; height: 16px; background: var(--accent); border: 2px solid #0c0e0c; border-radius: 3px; display: none; }
.cropping .frame .hd { display: block; }
.frame .hd.nw { left: -8px; top: -8px; cursor: nwse-resize; } .frame .hd.se { right: -8px; bottom: -8px; cursor: nwse-resize; }
.frame .hd.ne { right: -8px; top: -8px; cursor: nesw-resize; } .frame .hd.sw { left: -8px; bottom: -8px; cursor: nesw-resize; }
.frame .thirds { position: absolute; inset: 0; display: none; pointer-events: none;
  background: linear-gradient(90deg, transparent 33.2%, rgba(255,255,255,.25) 33.3%, transparent 33.5%, transparent 66.5%, rgba(255,255,255,.25) 66.6%, transparent 66.8%),
              linear-gradient(0deg, transparent 33.2%, rgba(255,255,255,.25) 33.3%, transparent 33.5%, transparent 66.5%, rgba(255,255,255,.25) 66.6%, transparent 66.8%); }
.cropping .frame .thirds { display: block; }
.zbar.cbar { display: none; }
.tilt { display: inline-flex; align-items: center; gap: 6px; font: 12px var(--mono); color: var(--muted); }
.tilt input[type=range] { accent-color: var(--accent); width: 150px; }
.tilt b { color: var(--text); font-weight: 500; min-width: 54px; display: inline-block; text-align: right; }
.cropping .zbar.cbar { display: flex; }
.cropping .zbar.normal { display: none; }
.card .cut { position: absolute; top: 6px; right: 6px; font: 11px/1 var(--mono); padding: 4px 5px; border-radius: 5px; background: rgba(0, 0, 0, .72); color: var(--accent); }
.card.sel .cut { right: 32px; }
.zbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 16px; background: var(--panel); border-top: 1px solid var(--line-2); }
.zbar .info { font: 12.5px var(--mono); color: var(--muted); flex: 1; min-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.zbar .info b { color: var(--text); font-weight: 500; }
/* sets */
.setrow { flex-basis: 100%; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.setrow .sl { font: 11.5px var(--mono); color: var(--faint); margin-right: 2px; }
.schip { background: transparent; border: 1px solid var(--line-2); border-radius: 999px; padding: 3px 10px; font: 12px var(--mono);
  color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.schip .d { width: 8px; height: 8px; border-radius: 2px; background: var(--c, var(--muted)); }
.schip b { font-weight: 500; color: var(--text); }
.schip kbd { font: 10px var(--mono); color: var(--faint); }
.schip.on { background: var(--panel-2); color: var(--text); border-color: var(--c, #4a544a); }
.schip.add { border-style: dashed; }
.schip.dropok { border-color: var(--c); background: color-mix(in srgb, var(--c) 24%, transparent); color: var(--text); }
.setrow input.in { padding: 3px 9px; border-radius: 999px; width: 200px; }
.setrow .shint { font: 11.5px var(--mono); color: var(--faint); margin-left: 6px; }
.card .sdots { position: absolute; right: 6px; bottom: 32px; display: flex; gap: 3px; padding: 4px 5px; border-radius: 5px; background: rgba(0, 0, 0, .7); }
.card .sdots i { width: 9px; height: 9px; border-radius: 2px; display: block; }
.zsets { display: inline-flex; gap: 5px; flex-wrap: wrap; align-items: center; }
.zsets .sl { font: 11.5px var(--mono); color: var(--faint); }
.act select.in { padding: 5px 8px; }
.zones.setzones { margin-top: 8px; }
.zones.setzones .zone { min-height: 42px; padding: 8px 12px; }
.zones.setzones .zone .d { border-radius: 3px; }

/* drag and drop */
.card .im { -webkit-user-drag: none; }
.card.lifted { opacity: .35; }
body.dragging, body.dragging * { cursor: grabbing !important; user-select: none; -webkit-user-select: none; }
.dragghost { position: fixed; z-index: 50; pointer-events: none; transform: translate(14px, 12px); }
.dragghost .pile { position: relative; width: 132px; height: 74px; }
.dragghost .pile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 6px;
  border: 1.5px solid rgba(255, 255, 255, .75); box-shadow: 0 8px 22px rgba(0, 0, 0, .65); background: #000; }
.dragghost .pile img:nth-last-child(2) { transform: rotate(5deg) translate(6px, -3px); }
.dragghost .pile img:nth-last-child(3) { transform: rotate(-5deg) translate(-6px, -2px); }
.dragghost .count { position: absolute; top: -9px; right: -9px; z-index: 2; min-width: 22px; padding: 0 6px; border-radius: 999px;
  background: var(--accent); color: var(--accent-ink); font: 700 12px/22px var(--sans); text-align: center; }
.dragghost .to { display: inline-block; margin-top: 8px; padding: 4px 8px; border-radius: 6px; background: rgba(0, 0, 0, .85);
  font: 12px var(--mono); color: var(--muted); white-space: nowrap; }
.dragghost .to b { color: var(--c); font-weight: 600; }
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; padding: 10px 20px 14px; background: rgba(19, 22, 19, .98);
  border-top: 1px solid var(--line-2); box-shadow: 0 -10px 30px rgba(0, 0, 0, .45); }
.dock .dhint { font: 12px var(--mono); color: var(--muted); margin-bottom: 8px; }
.zones { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.zone { display: flex; align-items: center; gap: 8px; min-height: 60px; padding: 12px 14px; border-radius: 10px; font: 13px var(--mono);
  border: 1.5px dashed color-mix(in srgb, var(--c) 55%, transparent); background: color-mix(in srgb, var(--c) 6%, transparent);
  transition: background .1s, border-color .1s; }
.zone .d { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
.zone b { font-weight: 600; }
.zone .zn { margin-left: auto; color: var(--faint); font-size: 11.5px; text-align: right; }
.zone.here, .zone.off { opacity: .3; }
.zone.dropok { border-style: solid; border-color: var(--c); background: color-mix(in srgb, var(--c) 24%, transparent); }
.tab.dropok, .ucard.dropok { border-color: var(--c); background: color-mix(in srgb, var(--c) 22%, transparent); color: var(--text); }
.grid.filedrop { outline: 2px dashed var(--accent); outline-offset: 6px; border-radius: 8px; }
.toasts { position: fixed; right: 18px; bottom: 70px; display: grid; gap: 8px; z-index: 60; max-width: min(460px, 92vw); }
.toast { background: #1b201b; border: 1px solid var(--line-2); border-left: 3px solid var(--accent); border-radius: 8px; padding: 10px 14px; font-size: 13px; }
.toast.err { border-left-color: var(--err); }
@media (max-width: 700px) {
  .top, .bar, main, .act { padding-left: 16px; padding-right: 16px; }
  .bar { position: static; }
  .act .hint { display: none; }
  :root { --tw: 150px; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="glyph">░▒▓</span>soundfilm <span class="sub">photo sorter</span></div>
  <a class="back" href="/">← dashboard</a>
  <div class="grow"></div>
  <span class="job" id="job"></span>
</header>

<div class="bar">
  <div class="tabs" id="tabs"></div>
  <div class="grow"></div>
  <button class="btn" id="impSel" title="Select photos in the Photos app first">Import Photos selection</button>
  <select class="in" id="impAlbum" title="Import a whole album from the Photos app"><option value="">Import album…</option></select>
  <button class="btn" id="impFiles">Add files…</button>
  <span class="seg" id="view"><button data-v="film" class="on" title="What the film shows: the centre 16:9">film crop</button><button data-v="whole">whole</button></span>
  <select class="in" id="order" title="Order of the photos"><option value="name">by name</option><option value="most">most used first</option><option value="least">least used first</option></select>
  <label class="ctl">size <input type="range" id="size" min="110" max="380" value="190"></label>
  <div class="setrow" id="setrow"></div>
</div>

<div class="ustrip" id="ustrip" title="How the next render uses each pool, with your saved settings"></div>
<main id="main"><div class="grid" id="grid"></div><div class="empty" id="empty" hidden></div></main>

<div class="act" id="act">
  <span class="n" id="nsel">nothing selected</span>
  <button class="btn" data-to="bright" style="--c:var(--bright)"><span class="d"></span>Bright<kbd>1</kbd></button>
  <button class="btn" data-to="texture" style="--c:var(--texture)"><span class="d"></span>Texture<kbd>2</kbd></button>
  <button class="btn" data-to="dark" style="--c:var(--dark)"><span class="d"></span>Dark<kbd>3</kbd></button>
  <button class="btn" data-to="suggest">Use suggestion<kbd>S</kbd></button>
  <button class="btn" data-to="rejected" style="--c:var(--rejected)"><span class="d"></span>Reject<kbd>X</kbd></button>
  <button class="btn" data-to="inbox" style="--c:var(--inbox)"><span class="d"></span>Back to inbox<kbd>0</kbd></button>
  <select class="in" id="addSet" title="Put the selected photos into a set (⇧1-9 toggles sets 1-9)" hidden></select>
  <select class="in" id="rmSet" title="Take the selected photos out of a set" hidden></select>
  <span class="hint">drag photos onto a pool or a set · click · ⇧-click range · ⌘-click add · ⌘A all · space: look closer · C: crop / rotate</span>
</div>

<div class="zoom" id="zoom" hidden>
  <div class="zimg" id="zimg"><div class="zwrap" id="zwrap"><img id="zpic" alt=""></div></div>
  <div class="zbar normal">
    <span class="info" id="zinfo"></span>
    <button class="btn" id="zcrop" title="Turn the photo and choose the part the film shows">✂ Crop / rotate…<kbd>C</kbd></button>
    <button class="btn" data-to="bright" style="--c:var(--bright)"><span class="d"></span>Bright<kbd>1</kbd></button>
    <button class="btn" data-to="texture" style="--c:var(--texture)"><span class="d"></span>Texture<kbd>2</kbd></button>
    <button class="btn" data-to="dark" style="--c:var(--dark)"><span class="d"></span>Dark<kbd>3</kbd></button>
    <button class="btn" data-to="suggest">Suggestion<kbd>S</kbd></button>
    <button class="btn" data-to="rejected" style="--c:var(--rejected)"><span class="d"></span>Reject<kbd>X</kbd></button>
    <button class="btn" data-to="inbox" style="--c:var(--inbox)"><span class="d"></span>Inbox<kbd>0</kbd></button>
    <span class="zsets" id="zsets"></span>
    <button class="btn" id="zprev">←</button><button class="btn" id="znext">→</button>
    <button class="btn" id="zclose">Close<kbd>esc</kbd></button>
  </div>
  <div class="zbar cbar">
    <span class="info">Drag to move · corners resize · scroll zooms · arrows nudge · + / − size</span>
    <button class="btn" id="crotl" title="Turn 90° to the left">⟲ 90°<kbd>[</kbd></button>
    <button class="btn" id="crotr" title="Turn 90° to the right">⟳ 90°<kbd>]</kbd></button>
    <label class="tilt" title="Tilt (, and . for half a degree, ⇧ for 5°)">tilt <input type="range" id="ctilt" min="-45" max="45" step="0.5" value="0"> <b id="cangle">0°</b></label>
    <button class="btn primary" id="csave">Save<kbd>↵</kbd></button>
    <button class="btn" id="ccentre" title="No rotation, centre of the photo (the default)">Reset<kbd>R</kbd></button>
    <button class="btn" id="ccancel">Cancel<kbd>esc</kbd></button>
  </div>
</div>
<div class="dock" id="dock" hidden>
  <div class="dhint" id="dhint"></div>
  <div class="zones">
    <div class="zone" data-drop="bright" style="--c:var(--bright)"><span class="d"></span><b>Bright</b><span class="zn"></span></div>
    <div class="zone" data-drop="texture" style="--c:var(--texture)"><span class="d"></span><b>Texture</b><span class="zn"></span></div>
    <div class="zone" data-drop="dark" style="--c:var(--dark)"><span class="d"></span><b>Dark</b><span class="zn"></span></div>
    <div class="zone" data-drop="rejected" style="--c:var(--rejected)"><span class="d"></span><b>Reject</b><span class="zn"></span></div>
    <div class="zone" data-drop="inbox" style="--c:var(--inbox)"><span class="d"></span><b>Inbox</b><span class="zn"></span></div>
  </div>
  <div class="zones setzones" id="setzones"></div>
</div>
<div class="toasts" id="toasts"></div>
<script src="/web/drag.js"></script>

<script>
// Every photo is in one folder: inbox, bright, texture, dark or rejected. Choosing a pool moves the file there
// (nothing is deleted or overwritten). The film only uses bright, texture and dark.
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const COLOR = {inbox: 'var(--inbox)', bright: 'var(--bright)', texture: 'var(--texture)', dark: 'var(--dark)', rejected: 'var(--rejected)'};
const TABS = ['inbox', 'bright', 'texture', 'dark', 'rejected', 'all'];
const KEYS = {'1': 'bright', '2': 'texture', '3': 'dark', 'x': 'rejected', '0': 'inbox', 's': 'suggest'};
const store = {get: k => { try { return localStorage.getItem('sorter.' + k); } catch { return null; } },
               set: (k, v) => { try { localStorage.setItem('sorter.' + k, v); } catch {} }};
let L = null, tab = store.get('tab') || 'inbox', view = store.get('view') || 'film';
let sel = new Set(), focus = 0, anchor = null, zoomAt = null, sig = '';

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({error: r.statusText}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function toast(msg, kind = '') {
  const t = document.createElement('div'); t.className = 'toast ' + kind; t.textContent = msg;
  $('#toasts').append(t); setTimeout(() => t.remove(), kind === 'err' ? 9000 : 3500);
}
let U = null, order = store.get('order') || 'name';                 // U: how the next render uses the photos
const usesOf = p => (U && U.photos && U.photos[p.ref]) ? U.photos[p.ref].cuts : 0;
const inPool = p => ['bright', 'texture', 'dark'].includes(p.where);

async function watchJob(id) {
  watching = id;
  while (watching === id) {
    await new Promise(r => setTimeout(r, 1000));
    let s; try { s = await api('/api/state'); } catch { continue; }
    const j = s.jobs.find(x => x.id === id);
    if (!j) break;
    $('#job').textContent = j.status === 'running' ? `${j.label}: ${Math.round(j.progress * 100)}%` : `${j.label}: ${j.status}`;
    if (j.status === 'done' || j.status === 'error') {
      if (j.status === 'error') toast(`${j.label}: ${j.error}`, 'err');
      else toast(`${j.label}: done${j.result && j.result.added !== undefined ? `, ${j.result.added} new photos in the inbox` : ''}`);
      setTimeout(() => { if (watching === id) $('#job').textContent = ''; }, 4000);
      watching = null; await load(); usageSoon(0); break;
    }
  }
}
$('#impSel').onclick = async () => {
  try { const r = await api('/api/import', {selection: true}); toast('Importing the photos selected in the Photos app…'); tab = 'inbox'; sig = ''; watchJob(r.job); }
  catch (e) { toast(e.message, 'err'); }
};
let albumsLoaded = false;
$('#impAlbum').addEventListener('focus', async () => {
  if (albumsLoaded) return; albumsLoaded = true;
  const s = $('#impAlbum'); s.innerHTML = '<option value="">loading albums from Photos…</option>';
  try {
    const al = await api('/api/albums');
    s.innerHTML = '<option value="">Import album…</option>' + al.map(a => `<option value="${esc(a.id)}">${esc(a.name)} (${a.count})</option>`).join('');
  } catch (e) { s.innerHTML = '<option value="">Import album…</option>'; albumsLoaded = false; toast(e.message, 'err'); }
});
$('#impAlbum').onchange = async () => {
  const s = $('#impAlbum'), id = s.value, name = s.selectedOptions[0].textContent.replace(/ \(\d+\)$/, '');
  s.value = ''; if (!id) return;
  try { const r = await api('/api/import', {album_id: id, album_name: name}); toast(`Importing album “${name}”…`); tab = 'inbox'; sig = ''; watchJob(r.job); }
  catch (e) { toast(e.message, 'err'); }
};
$('#impFiles').onclick = async () => {
  toast('Pick photos in the macOS window (it may be behind this one).');
  try {
    let r = await api('/api/choose', {to: 'inbox'});
    if (r.conflicts.length) toast(`${r.conflicts.length} already in the inbox with the same name; skipped`, 'err');
    for (const e of r.errors) toast(e, 'err');
    if (r.saved.length) toast(`${r.saved.length} photos added to the inbox`);
    tab = 'inbox'; sig = ''; load();
  } catch (e) { toast(e.message, 'err'); }
};

// ---------------------------------------------------------------- sets
// A set is a named group of photos (a photo can be in several). In the dashboard's Sections panel, each part of
// the track chooses the sets its cuts draw from.
const setColor = n => ((L && L.sets) || []).find(s => s.name === n)?.color || 'var(--muted)';
let naming = false;
function drawSets() {
  const S = L.sets || [];
  if (setFilter !== '*' && setFilter !== '-' && !S.some(s => s.name === setFilter)) { setFilter = '*'; store.set('setFilter', '*'); }
  const count = n => L.photos.filter(p => p.sets.includes(n)).length, none = L.photos.filter(p => !p.sets.length).length;
  const html = `<span class="sl">sets</span>` +
    `<button class="schip ${setFilter === '*' ? 'on' : ''}" data-sf="*" title="show photos whatever their sets">any</button>` +
    S.map((s, i) => `<button class="schip ${setFilter === s.name ? 'on' : ''}" data-sf="${esc(s.name)}" data-dropset="${esc(s.name)}" style="--c:${s.color}"
      title="show only ${esc(s.name)} · drop photos here to add them${i < 9 ? ` · ⇧${i + 1} puts the selected photos in or out` : ''}"><span class="d"></span>${esc(s.name)} <b>${count(s.name)}</b>${i < 9 ? `<kbd>⇧${i + 1}</kbd>` : ''}</button>`).join('') +
    (S.length ? `<button class="schip ${setFilter === '-' ? 'on' : ''}" data-sf="-" title="photos in no set">in no set <b>${none}</b></button>` : '') +
    (naming ? '' : `<button class="schip add" id="newSet" title="Make a set${sel.size ? ' (the selected photos go into it)' : ''}">+ New set</button>`) +
    (S.length ? '' : `<span class="shint">Group photos into sets, then give each part of the track its own sets in the dashboard's Sections panel.</span>`);
  const row = $('#setrow');
  if (naming) {                                          // leave the row alone while a name is being typed
    if (!row.querySelector('#newSetName')) { row.innerHTML = html + newSetInput(); row._html = null; row.querySelector('#newSetName').focus(); }
  } else if (row._html !== html) { row.innerHTML = html; row._html = html; }
  for (const [id, ph] of [['addSet', '＋ set…'], ['rmSet', '− set…']]) {
    const el = $('#' + id), opts = `<option value="">${ph}</option>` + S.map(s => `<option value="${esc(s.name)}">${esc(s.name)}</option>`).join('');
    if (el._opts !== opts) { el.innerHTML = opts; el._opts = opts; }
    el.hidden = !S.length;
  }
}
const newSetInput = () => `<input class="in" id="newSetName" maxlength="32" placeholder="set name${sel.size ? `, takes the ${sel.size} selected` : ''} (↵)">`;
$('#setrow').addEventListener('click', e => {
  if (e.target.closest('#newSet')) { naming = true; $('#setrow')._html = null; drawSets(); return; }
  const c = e.target.closest('[data-sf]'); if (!c) return;
  setFilter = setFilter === c.dataset.sf && c.dataset.sf !== '*' ? '*' : c.dataset.sf;
  store.set('setFilter', setFilter); sel.clear(); focus = 0; sig = ''; draw(); scrollTo(0, 0);
});
$('#setrow').addEventListener('keydown', async e => {
  if (e.target.id !== 'newSetName') return;
  if (e.key === 'Escape') { e.preventDefault(); naming = false; $('#setrow')._html = null; drawSets(); return; }
  if (e.key !== 'Enter') return;
  e.preventDefault();
  const name = e.target.value.trim(); if (!name) return;
  try {
    await api('/api/sets', {op: 'create', name});
    naming = false; $('#setrow')._html = null;
    const refs = [...sel];
    await load();
    if (refs.length) await setMembers(name, refs, true); else toast(`Made the set “${name}”. Drag photos onto it, or select some and press ⇧${(L.sets || []).length}.`);
  } catch (err) { toast(err.message, 'err'); }
});
$('#setrow').addEventListener('focusout', e => {
  if (e.target.id === 'newSetName' && !e.target.value.trim()) setTimeout(() => { naming = false; $('#setrow')._html = null; drawSets(); }, 150);
});
async function setMembers(name, refs, on) {
  if (!refs.length) return;
  try {
    const r = await api('/api/members', {refs, set: name, on});
    for (const e of r.errors) toast(e, 'err');
    for (const ref of refs) {
      const p = L.photos.find(x => x.ref === ref); if (!p) continue;
      if (on && !p.sets.includes(name)) p.sets.push(name);
      if (!on) p.sets = p.sets.filter(x => x !== name);
    }
    toast(r.changed ? `${on ? 'Added' : 'Took'} ${r.changed} photo${r.changed > 1 ? 's' : ''} ${on ? 'to' : 'out of'} ${name}` : `Already ${on ? 'in' : 'out of'} ${name}`);
    sig = ''; draw(); usageSoon();
  } catch (e) { toast(e.message, 'err'); }
}
function toggleSet(i, refs) {
  const s = (L.sets || [])[i]; if (!s || !refs.length) return;
  const all = refs.every(r => (L.photos.find(p => p.ref === r)?.sets || []).includes(s.name));
  setMembers(s.name, refs, !all);
}
$('#addSet').onchange = e => { const n = e.target.value; e.target.value = ''; if (n) setMembers(n, targets(), true); };
$('#rmSet').onchange = e => { const n = e.target.value; e.target.value = ''; if (n) setMembers(n, targets(), false); };
$('#zsets').addEventListener('click', e => {
  const b = e.target.closest('[data-zset]'); if (!b) return;
  const p = visible()[zoomAt]; if (p) setMembers(b.dataset.zset, [p.ref], !p.sets.includes(b.dataset.zset));
});

// ---------------------------------------------------------------- drag and drop
// Photos: drag one (or the selection) onto a pool: the dock at the bottom, a tab or a usage card.
// Files and folders from Finder: drop on a pool in the dock, or anywhere else to add them to the tab you're on.
const HOME = ['inbox', 'bright', 'texture', 'dark'];                // where new files may go
const fileHome = () => HOME.includes(tab) ? tab : 'inbox';
function showDock(mode, refs = []) {
  const dock = $('#dock');
  $('#grid').classList.toggle('filedrop', mode === 'files');
  if (!mode) { dock.hidden = true; return; }
  const from = new Set(refs.map(r => r.split('/')[0]));
  dock.querySelectorAll('.zone').forEach(z => {
    const w = z.dataset.drop, n = L ? L.counts[w] : 0;
    const off = mode === 'files' && !HOME.includes(w), here = mode === 'photos' && from.size === 1 && from.has(w);
    z.classList.toggle('off', off); z.classList.toggle('here', here);
    z.querySelector('.zn').textContent = off ? 'not for new files' : here ? 'already here' : `${n} photo${n === 1 ? '' : 's'}`;
  });
  $('#dhint').textContent = mode === 'files'
    ? `Drop on a pool to add the photos there, or on the grid to add them to ${fileHome()}. Folders work too.`
    : `Drop on a pool to move ${refs.length === 1 ? 'the photo' : `these ${refs.length} photos`} there (or on a tab at the top)${(L.sets || []).length ? ', or on a set to add to it' : ''}. Esc cancels.`;
  const S = mode === 'photos' ? (L.sets || []) : [];
  $('#setzones').hidden = !S.length;
  $('#setzones').innerHTML = S.map(st => {
    const all = refs.every(r => (L.photos.find(p => p.ref === r)?.sets || []).includes(st.name));
    return `<div class="zone ${all ? 'here' : ''}" data-dropset="${esc(st.name)}" style="--c:${st.color}"><span class="d"></span><b>${esc(st.name)}</b><span class="zn">${all ? 'already in it' : 'add to set'}</span></div>`;
  }).join('');
  dock.hidden = false;
}
window.SF && SF.pointerDrag({
  root: $('#grid'), items: '.card', targets: '[data-drop], [data-dropset]',
  start(el) {
    const v = visible(), i = +el.dataset.i, p = v[i];
    if (!p || zoomAt !== null) return null;
    if (!sel.has(p.ref)) { sel = new Set([p.ref]); anchor = i; }   // dragging an unselected photo drags just that one
    focus = i; draw();
    const refs = v.filter(x => sel.has(x.ref)).map(x => x.ref);
    document.querySelectorAll('#grid .card.sel').forEach(c => c.classList.add('lifted'));
    showDock('photos', refs);
    const pics = refs.slice(0, 3).map(r => document.querySelector(`#grid .card[data-ref="${CSS.escape(r)}"] .im`)).filter(Boolean).map(im => im.src);
    return {refs, ghost: `<div class="pile">${pics.reverse().map(s => `<img src="${esc(s)}" alt="">`).join('')}` +
      `${refs.length > 1 ? `<span class="count">${refs.length}</span>` : ''}</div><div class="to"></div>`};
  },
  accepts: (t, d) => t.dataset.dropset !== undefined
    ? d.refs.some(r => !(L.photos.find(p => p.ref === r)?.sets || []).includes(t.dataset.dropset))
    : t.dataset.drop in COLOR && d.refs.some(r => r.split('/')[0] !== t.dataset.drop),
  label: (t, d) => !t ? 'drop on a pool or a set'
    : t.dataset.dropset !== undefined ? `add ${d.refs.length > 1 ? d.refs.length + ' ' : ''}to set <b style="--c:${setColor(t.dataset.dropset)}">${esc(t.dataset.dropset)}</b>`
    : `move ${d.refs.length > 1 ? d.refs.length + ' ' : ''}to <b style="--c:${COLOR[t.dataset.drop]}">${t.dataset.drop}</b>`,
  async drop(t, d) {
    if (t.dataset.dropset !== undefined) return setMembers(t.dataset.dropset, d.refs, true);
    const to = t.dataset.drop, n = await assign(to, d.refs);
    if (n) toast(`Moved ${n} photo${n > 1 ? 's' : ''} to ${to}`);
  },
  end() { showDock(null); document.querySelectorAll('#grid .card.lifted').forEach(c => c.classList.remove('lifted')); },
});
window.SF && SF.fileDrops({
  where: el => {
    const z = el && el.closest('[data-drop]');
    if (z) return HOME.includes(z.dataset.drop) ? z.dataset.drop : null;
    return zoomAt === null ? fileHome() : null;
  },
  light: to => document.querySelector(`#dock .zone[data-drop="${to}"]`),
  show: on => showDock(on ? 'files' : null),
  refused: () => toast(zoomAt === null ? 'New photos go into the inbox or a pool; reject them from there.' : 'Close the large view first, then drop the files.', 'err'),
  drop: (to, files) => addFiles(to, files),
});
let adding = false;
async function addFiles(to, files) {
  const exts = new Set(L ? L.exts : []);
  const pics = files.filter(f => exts.has(SF.extOf(f.name))), others = files.length - pics.length;
  if (!pics.length) {
    toast(files.length ? `None of that is a photo this reads (${[...exts].join(' ')})`
      : 'Nothing came through. From the Photos app, drag the photos to the Desktop first, or use Import Photos selection.', 'err');
    return;
  }
  const have = new Map((L ? L.photos : []).map(p => [p.name.toLowerCase() + '|' + p.size, p]));
  const dupes = [], taken = [];
  let added = 0;
  adding = true;
  for (let i = 0; i < pics.length; i++) {
    const f = pics[i], same = have.get(f.name.toLowerCase() + '|' + f.size);
    $('#job').textContent = `adding ${i + 1}/${pics.length} to ${to}…`;
    if (same) { dupes.push(`${f.name} (in ${same.where})`); continue; }    // the same photo is already here
    try {
      const r = await fetch(`/api/upload?to=${encodeURIComponent(to)}&name=${encodeURIComponent(f.name)}`, {method: 'POST', body: f});
      const j = await r.json().catch(() => ({error: r.statusText}));
      if (r.status === 409) taken.push(f.name);
      else if (!r.ok) toast(`${f.name}: ${j.error || r.statusText}`, 'err');
      else { added++; have.set(f.name.toLowerCase() + '|' + f.size, {where: to}); }
    } catch (e) { toast(`${f.name}: ${e.message}`, 'err'); }
  }
  adding = false; $('#job').textContent = '';
  const some = (xs, n = 3) => xs.slice(0, n).join(', ') + (xs.length > n ? ` and ${xs.length - n} more` : '');
  if (added) toast(`Added ${added} photo${added > 1 ? 's' : ''} to ${to}`);
  if (dupes.length) toast(`Already have ${dupes.length > 1 ? 'these' : 'this'}, skipped: ${some(dupes)}`, 'err');
  if (taken.length) toast(`A different photo in ${to} already has the name ${some(taken)}; skipped. Rename it and drop it again.`, 'err');
  if (others) toast(`Skipped ${others} file${others > 1 ? 's' : ''} that ${others > 1 ? "aren't photos" : "isn't a photo"}`);
  sig = ''; await load(); if (added) usageSoon(0);
}

load(); loadUsage();
setInterval(() => { if (document.visibilityState === 'visible' && zoomAt === null) loadUsage(); }, 15000);
(function poll() {                                      // pick up suggestions as they're worked out, and files added in Finder
  setTimeout(async () => {
    if (!watching && zoomAt === null && document.visibilityState === 'visible') await load();
    poll();
  }, L && L.unscored ? 2000 : 6000);
})();
</script>
</body>
</html>
